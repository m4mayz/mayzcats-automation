[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayzcats"
version = "1.0.0"
description = "Colab-ready YouTube Shorts automation for MayzCats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "google-api-python-client>=2.149,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "sentence-transformers>=3.2,<6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
mayzcats = "mayzcats.pipeline:main"
mayzcats-preflight = "mayzcats.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".uv-cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
