name: MayzCats daily upload schedule
on:
  schedule:
    # Upload early; YouTube publishes at the assigned 16:00/23:00 WIB slot.
    - cron: "0 0 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the current schedule slot already ran
        type: boolean
        default: true
      mode:
        description: Auto resumes pending run; new abandons its retry
        type: choice
        options: [auto, new]
        default: auto
permissions:
  contents: write
  actions: read
jobs:
  mayzcats:
    uses: m4mayz/mayzcats-automation/.github/workflows/github-runner.yml@codex/github-actions
    with:
      force: ${{ inputs.force || false }}
      mode: ${{ inputs.mode || 'auto' }}
      publish_hour_wib: ${{ github.event.schedule == '0 0 * * *' && '16' || github.event.schedule == '0 7 * * *' && '23' || '' }}
    secrets: inherit
