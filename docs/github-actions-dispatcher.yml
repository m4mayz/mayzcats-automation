name: MayzCats daily upload schedule
on:
  schedule:
    # 12:00 and 17:00 WIB (UTC+7).
    - cron: "0 5,10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the current schedule slot already ran
        type: boolean
        default: true
      mode:
        description: Auto resumes pending run; new abandons its retry
        type: choice
        options: [auto, new]
        default: auto
permissions:
  contents: write
  actions: read
jobs:
  mayzcats:
    uses: m4mayz/mayzcats-automation/.github/workflows/github-runner.yml@codex/github-actions
    with:
      force: ${{ inputs.force || false }}
      mode: ${{ inputs.mode || 'auto' }}
    secrets: inherit
